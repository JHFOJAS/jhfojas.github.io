<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Print & Production | Jake Harley Fojas</title>
  <meta name="description" content="Explore print design, production artwork, labels, stickers, and print-ready creative work by Jake Harley Fojas.">

  <link rel="icon" type="image/png" href="../assets/images/jake-avatar.png">
  <link rel="stylesheet" href="https://use.typekit.net/cej8zmi.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/jake-avatar.png">
  <link rel="stylesheet" href="../assets/css/category-global.css">
  <link rel="stylesheet" href="../assets/css/gallery-lightbox.css">
  
</head>

<body>

  <div class="page-container">

<div id="categoryHeader"></div>

    <main>

      <section class="page-hero">
        <div class="section-label">
          SELECTED WORK / 03
        </div>

        <h1>
          Print & <span>Production.</span>
        </h1>

        <div class="hero-bottom">
          <p class="hero-description">
            A collection of print-focused creative work, including
            labels, stickers, marketing materials, production artwork,
            and print-ready designs prepared for real-world applications.
          </p>

          <div class="image-count" id="imageCount">
            00 DESIGN PIECES
          </div>
        </div>
      </section>

      <section class="gallery-section">
        <div class="gallery-grid" id="printDesignGallery"></div>
      </section>

    </main>

 <div id="categoryFooter"></div>

  </div>

  <script>

const printDesignImages = Array.from(
  { length: 50 },
  (_, index) => `image-${String(index + 1).padStart(2, "0")}.png`
);

const gallery = document.getElementById("printDesignGallery");
const imageCount = document.getElementById("imageCount");

    const sortedImages = [...printDesignImages].sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true })
    );

    sortedImages.forEach((filename, index) => {
      const item = document.createElement("div");
      item.className = "gallery-item";

      const image = document.createElement("img");

      image.src = `../assets/images/portfolio/projects/print-design/${filename}`;
      image.alt = `Print and production design artwork ${index + 1}`;
      image.loading = "lazy";

      item.appendChild(image);
      gallery.appendChild(item);
    });

    imageCount.textContent =
      `${sortedImages.length.toString().padStart(2, "0")} DESIGN PIECES`;
  </script>
<script src="../assets/js/category-global.js"></script>
<script src="../assets/js/gallery-lightbox.js"></script>
<script src="../assets/js/image-protection.js"></script>
</body>
</html>
