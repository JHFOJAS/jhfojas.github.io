<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creative Experiments | Jake Harley Fojas</title>
  <meta name="description" content="Explore creative technology, AI-assisted workflows, interactive concepts, and experimental digital projects by Jake Harley Fojas.">

  <link rel="icon" type="image/png" href="assets/images/jake-avatar.png">
  <link rel="stylesheet" href="https://use.typekit.net/cej8zmi.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/jake-avatar.png">
  <link rel="stylesheet" href="assets/css/category-global.css">
  <link rel="stylesheet" href="assets/css/gallery-lightbox.css">
  
</head>

<body>

  <div class="page-container">
  <div id="categoryHeader"></div>

    <main>

      <section class="page-hero">
        <div class="section-label">
          SELECTED WORK / 04
        </div>

        <h1>
          Creative <span>Experiments.</span>
        </h1>

        <div class="hero-bottom">
          <p class="hero-description">
            A collection of experimental creative projects exploring
            emerging technologies, AI-assisted workflows, interactive
            experiences, digital concepts, and new possibilities
            in design and development.
          </p>

          <div class="image-count" id="imageCount">
            00 DESIGN PIECES
          </div>
        </div>
      </section>

      <section class="gallery-section">
        <div class="gallery-grid" id="creativeExperimentsGallery"></div>
      </section>

    </main>

<div id="categoryFooter"></div>

  </div>

  <script>

    const creativeExperimentsImages = [
      "image-01.png",
      "image-02.png",
      "image-03.png"
    ];

    const gallery = document.getElementById("creativeExperimentsGallery");
    const imageCount = document.getElementById("imageCount");

    const sortedImages = [...creativeExperimentsImages].sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true })
    );

    sortedImages.forEach((filename, index) => {
      const item = document.createElement("div");
      item.className = "gallery-item";

      const image = document.createElement("img");

      image.src = `assets/images/portfolio/projects/creative-experiments/${filename}`;
      image.alt = `Creative experiment and digital concept ${index + 1}`;
      image.loading = "lazy";

      item.appendChild(image);
      gallery.appendChild(item);
    });

    imageCount.textContent =
      `${sortedImages.length.toString().padStart(2, "0")} DESIGN PIECES`;
  </script>
<script src="assets/js/category-global.js"></script>
<script src="assets/js/gallery-lightbox.js"></script>
<script src="assets/js/image-protection.js"></script>
</body>
</html>
