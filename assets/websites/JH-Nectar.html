      :root {
        --u: 1px;
        --fy: 0px;
        --n: clamp(0.5px, min(100vw / 1440, 100vh / 900), 1.3px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        background-color: #C2B0DC;
        color: #FFFFFF;
        font-family: 'Poppins', system-ui, sans-serif;
        touch-action: pan-y;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .slide.is-active {
        visibility: visible;
        z-index: 2;
      }

      .slide.is-under {
        visibility: visible;
        z-index: 1;
      }

      .frame {
        position: absolute;
        width: calc(1440 * var(--u));
        height: calc(900 * var(--u));
        left: calc(50% - 720 * var(--u));
        top: calc(50% - 450 * var(--u) + var(--fy));
      }

      .layer {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      .word {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Poppins', system-ui, sans-serif;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        color: #FFFFFF;
        pointer-events: none;
      }

      .shadow-ellipse {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(60, 40, 80, 0.22), transparent);
        filter: blur(calc(4 * var(--u)));
        pointer-events: none;
      }

      .bottle {
        position: absolute;
        background-repeat: no-repeat;
        pointer-events: none;
      }

      .bottle-label {
        position: absolute;
        pointer-events: none;
        overflow: visible;
      }

      .piece {
        position: absolute;
        pointer-events: none;
      }

      .piece.is-mirrored {
        transform: scaleX(-1);
      }

      .layer-corner .piece {
        filter: blur(calc(9 * var(--u)));
      }

      .piece-inner {
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
        animation: bob var(--dur, 4s) ease-in-out var(--delay, 0s) infinite alternate;
        will-change: transform;
      }

      @keyframes bob {
        0% {
          transform: translateY(calc(-7 * var(--u))) rotate(calc(var(--rot, 0deg) - 3deg));
        }
        100% {
          transform: translateY(calc(7 * var(--u))) rotate(calc(var(--rot, 0deg) + 3deg));
        }
      }

      /* Fixed UI layer */
      .ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .ui a,
      .ui button {
        pointer-events: auto;
        background: none;
        border: 0;
        padding: 0;
        margin: 0;
        color: #FFFFFF;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
        text-shadow: 0 1px 6px rgba(90, 70, 40, 0.18);
      }

      .ui .sep {
        text-shadow: 0 1px 6px rgba(90, 70, 40, 0.18);
      }

      .ui a:focus-visible,
      .ui button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.85);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .header {
        position: absolute;
        left: calc(50 * var(--n));
        right: calc(50 * var(--n));
        top: calc(26 * var(--n));
        height: calc(50 * var(--n));
        display: flex;
        align-items: center;
      }

      .logo {
        font-family: 'Baloo 2', system-ui, sans-serif !important;
        font-weight: 800 !important;
        font-size: calc(51 * var(--n)) !important;
        letter-spacing: -0.02em;
        line-height: 1 !important;
        display: inline-block;
      }

      .tabs {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: calc(88 * var(--n));
        font-weight: 500;
        font-size: calc(21 * var(--n));
      }

      .tab {
        padding: calc(6 * var(--n)) 0 !important;
        line-height: 1.3;
        white-space: nowrap;
      }

      .tab-underline {
        position: absolute;
        left: 0;
        top: calc(100% + 2 * var(--n));
        height: 2px;
        border-radius: 2px;
        background-color: #FFFFFF;
        box-shadow: 0 1px 6px rgba(90, 70, 40, 0.18);
        pointer-events: none;
        transition:
          transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
          width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
      }

      .account {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: calc(22 * var(--n));
        font-weight: 500;
        font-size: calc(21 * var(--n));
        white-space: nowrap;
      }

      .sep {
        opacity: 0.9;
        user-select: none;
      }

      .shop-now {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(36 * var(--n));
        font-weight: 600 !important;
        font-size: calc(21 * var(--n)) !important;
        letter-spacing: 0.2em;
        padding: calc(10 * var(--n)) calc(16 * var(--n)) !important;
        white-space: nowrap;
        line-height: 1.5;
      }

      .arrow {
        position: absolute;
        bottom: calc(30 * var(--n));
        width: calc(52 * var(--n));
        height: calc(52 * var(--n));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .arrow-prev {
        left: calc(36 * var(--n));
      }

      .arrow-next {
        right: calc(36 * var(--n));
      }

      .arrow svg {
        width: calc(28 * var(--n));
        height: calc(28 * var(--n));
        display: block;
        filter: drop-shadow(0 1px 6px rgba(90, 70, 40, 0.18));
      }

      /* Opening reveal initial hidden state */
      .is-opening .ui-reveal {
        opacity: 0;
        translate: 0 14px;
      }

      /* Mobile layout: width <= 820px or portrait (height > width) */
      html.is-mobile {
        --n: 1px;
      }

      html.is-mobile .header {
        left: 20px;
        right: 20px;
        top: 16px;
        height: 40px;
      }

      html.is-mobile .logo {
        font-size: 34px !important;
      }

      html.is-mobile .account {
        font-size: 15px;
        gap: 10px;
      }

      html.is-mobile .tabs {
        top: 52px;
        gap: 22px;
        font-size: 15px;
      }

      html.is-mobile .tab {
        padding: 6px 0 !important;
      }

      html.is-mobile .tab-underline {
        top: calc(100% + 2px);
      }

      html.is-mobile .shop-now {
        font-size: 15px !important;
        bottom: 22px;
        padding: 10px 16px !important;
      }

      html.is-mobile .arrow {
        width: 48px;
        height: 48px;
        bottom: 12px;
      }

      html.is-mobile .arrow-prev {
        left: 8px;
      }

      html.is-mobile .arrow-next {
        right: 8px;
      }

      html.is-mobile .arrow svg {
        width: 24px;
        height: 24px;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .piece-inner {
          animation: none !important;
          transform: rotate(var(--rot, 0deg));
        }

        .tab-underline {
          transition: none !important;
        }

        .is-opening .ui-reveal {
          opacity: 1 !important;
          translate: none !important;
        }
      }
    </style>
  </head>

          if (t >= 1) return 1;

            var c0 = COVER_TABLE[i][1];
            var t1 = COVER_TABLE[i + 1][0];
            var c1 = COVER_TABLE[i + 1][1];
            if (t >= t0 && t <= t1) {
              var span = t1 - t0;
              var k = span > 0 ? (t - t0) / span : 0;

          var completed = 0;
          uiSchedule.forEach(function (item) {
            var anim = item.el.animate(
              [
                { opacity: 0, translate: '0 14px' },
                { opacity: 1, translate: '0 0px' }
              ],
              { duration: 1000, delay: item.delay, easing: easing, fill: 'both' }
            );
            anim.onfinish = function () {
              item.el.style.opacity = '1';
              item.el.style.translate = '0 0px';
              completed++;
              if (completed === uiSchedule.length) {
                finishOpeningImmediately();
              }
            };
            openingAnimations.push(anim);
          });

          openingFailsafeTimer = setTimeout(finishOpeningImmediately, 3000);
        }

        function updateActiveTabAttributes(nextIdx) {
          tabButtons.forEach(function (btn, idx) {
            if (idx === nextIdx) {
              btn.setAttribute('aria-current', 'true');
            } else {
              btn.removeAttribute('aria-current');
            }
          });
        }

        function goTo(targetIndex, dir) {
          if (isTransitioning || targetIndex === currentIndex) return;
          finishOpeningImmediately();

          var fromSlide = slides[currentIndex];
          var toSlide = slides[targetIndex];
          var prevIndex = currentIndex;
          currentIndex = targetIndex;

          updateActiveTabAttributes(targetIndex);
          updateUnderline(false);
          document.body.style.backgroundColor = toSlide.flavour.color;

          if (reducedMotion) {
            fromSlide.section.classList.remove('is-active', 'is-under');
            fromSlide.section.setAttribute('aria-hidden', 'true');
            clearSlideTransforms(fromSlide);

            toSlide.section.classList.remove('is-under');
            toSlide.section.classList.add('is-active');
            toSlide.section.setAttribute('aria-hidden', 'false');
            clearSlideTransforms(toSlide);
            return;
          }

          isTransitioning = true;

          // Prepare B underneath A with initial parallax offset
          toSlide.section.classList.remove('is-active');
          toSlide.section.classList.add('is-under');
          toSlide.section.setAttribute('aria-hidden', 'false');
          setSlideLayerOffsets(toSlide, dir, 0);

          // Keep A on top
          fromSlide.section.classList.remove('is-under');
          fromSlide.section.classList.add('is-active');
          fromSlide.section.setAttribute('aria-hidden', 'false');

          var startTime = null;

          function tick(now) {
            if (startTime === null) startTime = now;
            var elapsed = now - startTime;
            var t = elapsed / WIPE_DURATION;
            var tClamped = clamp(t, 0, 1);
            var c = cover(tClamped);
            var frameW = 1440 * currentU;

            // Clip A from right-to-left (dir > 0) or left-to-right (dir < 0)
            var pct = (c * 100).toFixed(4) + '%';
            fromSlide.section.style.clipPath =
              dir > 0 ? 'inset(0 ' + pct + ' 0 0)' : 'inset(0 0 0 ' + pct + ')';

            // Drift A away
            var driftX = -dir * c * 0.14 * frameW;
            Object.keys(fromSlide.layers).forEach(function (key) {
              fromSlide.layers[key].style.transform = 'translateX(' + driftX + 'px)';
            });

            // Arrive B with parallax: k = easeOutQuad((t - 0.5) / 0.42), clamped 0..1
            var k = easeOutQuad(clamp((t - 0.5) / 0.42, 0, 1));
            setSlideLayerOffsets(toSlide, dir, k);

            if (t < 1 || k < 1) {
              requestAnimationFrame(tick);
            } else {
              // Finish
              slides.forEach(function (s, i) {
                s.section.classList.remove('is-active', 'is-under');
                clearSlideTransforms(s);
                if (i === targetIndex) {
                  s.section.classList.add('is-active');
                  s.section.setAttribute('aria-hidden', 'false');
                } else {
                  s.section.setAttribute('aria-hidden', 'true');
                }
              });
              isTransitioning = false;
            }
          }

          requestAnimationFrame(tick);
          void prevIndex;
        }

        function step(dir) {
          var nextIdx = (currentIndex + dir + FLAVOURS.length) % FLAVOURS.length;
          goTo(nextIdx, dir);
        }

        function markInteraction() {
          lastInteraction = Date.now();
        }

        // Tab clicks
        tabButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            markInteraction();
            var idx = parseInt(btn.getAttribute('data-index'), 10);
            if (isNaN(idx) || idx === currentIndex) return;
            var dir = idx > currentIndex ? 1 : -1;
            goTo(idx, dir);
          });
        });

        // Arrow clicks
        document.getElementById('ui-prev').addEventListener('click', function () {
          markInteraction();
          step(-1);
        });

        document.getElementById('ui-next').addEventListener('click', function () {
          markInteraction();
          step(1);
        });

        // Keyboard arrows
        window.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight') {
            markInteraction();
            step(1);
          } else if (e.key === 'ArrowLeft') {
            markInteraction();
            step(-1);
          }
        });

        // Swipe and drag on stage
        var pointerStart = null;
        stage.addEventListener('pointerdown', function (e) {
          pointerStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
        });

        window.addEventListener('pointerup', function (e) {
          if (!pointerStart || e.pointerId !== pointerStart.id) return;
          var dx = e.clientX - pointerStart.x;
          var dy = e.clientY - pointerStart.y;
          pointerStart = null;
          if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
            markInteraction();
            step(dx < 0 ? 1 : -1);
          }
        });

        window.addEventListener('pointercancel', function () {
          pointerStart = null;
        });

        // Prevent hash jumps on placeholder links
        ui.addEventListener('click', function (e) {
          var anchor = e.target.closest('a');
          if (anchor) {
            e.preventDefault();
            markInteraction();
          }
        });

        // Autoplay every 2600ms if page is visible and idle for 6s
        setInterval(function () {
          if (document.hidden || isTransitioning) return;
          if (Date.now() - lastInteraction >= INTERACTION_PAUSE) {
            step(1);
          }
        }, AUTOPLAY_INTERVAL);

        // Resize handling
        window.addEventListener('resize', layout);

        // Initial layout before fonts settle, keeping Berry layers off-right until opening starts
        layout();
        if (!reducedMotion) {
          setSlideLayerOffsets(slides[0], 1, 0);
        }

        // Start opening sequence once fonts are ready (with 3s failsafe)
        openingFailsafeTimer = setTimeout(finishOpeningImmediately, 3000);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(runOpeningSequence, runOpeningSequence);
        } else {
          runOpeningSequence();
        }
      })();
    </script>
  </body>
</html>
