<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Design | Jake Harley Fojas</title>
  <meta name="description" content="Explore website design, WordPress development, landing pages, and digital experiences by Jake Harley Fojas.">

  <link rel="icon" type="image/png" href="assets/images/jake-avatar.png">
  <link rel="stylesheet" href="https://use.typekit.net/cej8zmi.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/jake-avatar.png">
  <link rel="stylesheet" href="assets/css/category-global.css">
  
  <style>

  .web-design-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(23, 19, 19, 0.94);
    padding: 40px;
    align-items: center;
    justify-content: center;
  }

  .web-design-modal.open {
    display: flex;
  }

  .web-design-modal-content {
    width: 100%;
    max-width: 1200px;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .web-design-modal-content img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 5px;
  }

  .web-design-modal-close {
    position: absolute;
    top: 20px;
    right: 30px;
    background: none;
    border: none;
    color: #F7F6F3;
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.25s ease;
  }

  .web-design-modal-close:hover {
    color: #F04B22;
  }

  @media (max-width: 768px) {
    .web-design-modal {
      padding: 20px;
    }

    .web-design-modal-close {
      top: 12px;
      right: 18px;
      font-size: 36px;
    }
  }
</style>
  
</head>
<body>

<div class="page-container">
<div id="categoryHeader"></div>

    <main>
      <section class="page-hero">
        <div class="section-label">
          SELECTED WORK / 02
        </div>

        <h1>
          Website <span>Design.</span>
        </h1>

        <div class="hero-bottom">
          <p class="hero-description">
            A collection of website designs, WordPress development,
            responsive layouts, landing pages, and digital experiences
            created to bring ideas and brands to life online.
          </p>

          <div class="image-count" id="imageCount">
            00 DESIGN PIECES
          </div>
        </div>
      </section>

      <section class="gallery-section">
        <div class="gallery-grid" id="webDesignGallery"></div>
      </section>

    </main>
<div class="web-design-modal" id="webDesignModal" aria-hidden="true">

  <button
    class="web-design-modal-close"
    id="webDesignModalClose"
    type="button"
    aria-label="Close presentation"
  >
    &times;
  </button>

  <div class="web-design-modal-content">
    <img
      id="webDesignModalImage"
      src=""
      alt="Website design presentation"
    >
  </div>

</div>
<div id="categoryFooter"></div>

  </div>

  <script>

    const webDesignImages = [
      "image-01.jpg",
      "image-02.jpg",
      "image-03.jpg"
    ];
    const webDesignModal = document.getElementById("webDesignModal");
const webDesignModalImage = document.getElementById("webDesignModalImage");
const webDesignModalClose = document.getElementById("webDesignModalClose");

function openWebDesignModal(filename) {
  webDesignModalImage.src =
    `assets/images/portfolio/projects/web-design/presentations/${filename}`;

  webDesignModalImage.alt =
    `Website design presentation — ${filename}`;

  webDesignModal.classList.add("open");
  webDesignModal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeWebDesignModal() {
  webDesignModal.classList.remove("open");
  webDesignModal.setAttribute("aria-hidden", "true");
  webDesignModalImage.src = "";
  document.body.style.overflow = "";
}

webDesignModalClose.addEventListener("click", closeWebDesignModal);
webDesignModal.addEventListener("click", (event) => {
  if (event.target === webDesignModal) {
    closeWebDesignModal();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && webDesignModal.classList.contains("open")) {
    closeWebDesignModal();
  }
});
    const gallery = document.getElementById("webDesignGallery");
    const imageCount = document.getElementById("imageCount");

    const sortedImages = [...webDesignImages].sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true })
    );

    sortedImages.forEach((filename, index) => {
      const item = document.createElement("div");
      item.className = "gallery-item";

      const image = document.createElement("img");

      image.src = `assets/images/portfolio/projects/web-design/thumbnails/${filename}`;
      image.alt = `Website design and development work ${index + 1}`;
      image.loading = "lazy";

item.appendChild(image);

item.style.cursor = "pointer";

item.addEventListener("click", () => {
  openWebDesignModal(filename);
});

gallery.appendChild(item);
    });

    imageCount.textContent =
      `${sortedImages.length.toString().padStart(2, "0")} DESIGN PIECES`;
  </script>
<script src="assets/js/category-global.js"></script>
<script src="assets/js/image-protection.js"></script>
</body>
</html>
